<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>कौतुक — होस्ट</title>
<link rel="stylesheet" href="style.css">
<script src="sound.js"></script></head>
<body><main id="app">लोड हो रहा है…</main>
<script>
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let H={names:[]},off=0,tmr,tick,ex=[],C={};
async function api(a,o,post){
  const t1=Date.now();let r;
  try{r=post?await fetch("/api",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({a},o))})
    :await fetch("/api?"+new URLSearchParams(Object.assign({a},o)))}catch(e){return{_s:0}}
  let j={};try{j=await r.json()}catch(e){}
  j._s=r.status;if(j.now)off=j.now-(t1+Date.now())/2;return j}
const srv=()=>Date.now()+off;
function pic(i){return i?`<div class="pic">${/^(https?:|data:|img\/)/.test(i)?`<img src="${esc(i)}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:esc(i)}</div>`:""}
api("cats").then(j=>{C=j.cats||{};menu()});
function menu(){
  const all=Object.assign({},C);let tot=0;
  ex.forEach(q=>{all[q[0]]=(all[q[0]]||0)+1});
  Object.values(all).forEach(n=>tot+=n);
  app.innerHTML=`<p style="margin:4px 0"><a href="/" style="color:var(--mut)">← मुख्य पृष्ठ</a></p><h1>🧠 कौतुक — होस्ट</h1><small class="mut">कुल प्रश्न: ${tot}</small>
  <div class="card"><b>श्रेणी</b><select id="cat"><option value="">🎲 सभी श्रेणियाँ मिलाकर</option>${Object.keys(all).map(c=>`<option value="${esc(c)}">${esc(c)} (${all[c]})</option>`).join("")}</select>
  <b>प्रश्नों की संख्या</b><select id="nq"><option>10</option><option>15</option><option>20</option><option>30</option></select>
  <b>प्रति प्रश्न समय</b><select id="sec"><option value="15">15 सेकंड</option><option value="20" selected>20 सेकंड</option><option value="30">30 सेकंड</option></select>
  <button class="p" id="go" style="margin-top:10px">🚀 गेम बनाएँ</button></div>
  <div class="card"><b>अपने प्रश्न जोड़ें (JSON)</b><br><small class="mut">इस गेम के लिए ही जुड़ते हैं। प्रारूप: ["श्रेणी","प्रश्न",["क","ख","ग","घ"],सही_क्रमांक,"चित्र"]</small>
  <input type="file" id="f" accept=".json">${ex.length?`<p class="mut">जुड़े अपने प्रश्न: ${ex.length}</p>`:""}</div>
  <p class="mut ctr"><small>प्रश्नों के उत्तर सर्वर पर रहते हैं; होस्ट को भी उत्तर समय पूरा होने पर ही दिखते हैं।</small></p>`;
  $("#f").onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;ex=ex.concat(d);menu();alert(d.length+" प्रश्न जुड़े")}catch(x){alert("फ़ाइल का प्रारूप सही नहीं")}};r.readAsText(e.target.files[0])};
  $("#go").onclick=start}
async function start(){
  const cat=$("#cat").value,n=+$("#nq").value;H.L=+$("#sec").value;
  $("#go").disabled=true;
  const j=await api("create",{cat,n,L:H.L,extra:ex},true);
  if(!j.pin){$("#go").disabled=false;return alert(j.e==="empty"?"इस श्रेणी में प्रश्न नहीं हैं":"गेम नहीं बन सका — Netlify फ़ंक्शन/Blobs जाँचें")}
  H.pin=j.pin;H.hk=j.hk;H.names=[];lobby();lobbyPoll()}
function lobby(){
  Snd.music("lobby");
  const url=location.origin+"/?pin="+H.pin;
  app.innerHTML=`<div class="card"><div class="ctr mut">मोबाइल पर खोलें: <b>${esc(location.host)}</b> और PIN डालें</div><div class="pin">${H.pin}</div>
  <div class="ctr"><small class="mut">सीधा लिंक: ${esc(url)}</small></div></div>
  <div class="card"><b>जुड़े खिलाड़ी (<span id="cnt">${H.names.length}</span>)</b><div class="chips" id="nl"></div></div>
  <button class="p" id="st" disabled>▶ खेल शुरू करें</button>`;
  $("#st").onclick=()=>{clearTimeout(tmr);nextQ()};showNames()}
function showNames(){const nl=$("#nl");if(!nl)return;nl.innerHTML=H.names.map(x=>`<span>${esc(x)}</span>`).join("");$("#cnt").textContent=H.names.length;$("#st").disabled=!H.names.length}
async function lobbyPoll(){
  const j=await api("players",{pin:H.pin,hk:H.hk});
  if(j.ps){H.names=j.ps.map(p=>p.n).sort();showNames()}
  tmr=setTimeout(lobbyPoll,2000)}
async function nextQ(){
  const j=await api("next",{pin:H.pin,hk:H.hk},true);
  if(!j.meta){return alert("आगे नहीं बढ़ सका — फिर कोशिश करें")}
  if(j.meta.ph==="end")return end(j.meta);
  H.m=j.meta;H.t0=H.m.t0;Snd.start();Snd.music("q");qView();qLoop()}
function qView(){
  const m=H.m;
  app.innerHTML=`<div class="bar"><span>${esc(m.c)} · प्रश्न ${m.i+1}/${m.n}</span><span id="ac">उत्तर: 0/${H.names.length}</span></div><div class="t"><i id="tb"></i></div>
  <div class="card">${pic(m.img)}<div class="big" style="font-size:1.5rem">${esc(m.q)}</div></div>
  <div class="o">${m.o.map((t,i)=>`<div class="c${i}">${"▲◆●■"[i]} ${esc(t)}</div>`).join("")}</div>
  <button id="skip" style="margin-top:12px;width:100%">अभी परिणाम दिखाएँ</button>`;
  $("#skip").onclick=()=>{clearTimeout(tmr);clearInterval(tick);reveal()};
  const tb=$("#tb");clearInterval(tick);let ls=99;
  tick=setInterval(()=>{const left=(H.t0+H.L*1000)-srv();tb.style.width=Math.max(0,left/(H.L*1000)*100)+"%";const s=Math.ceil(left/1000);if(s<=5&&s>0&&s!==ls){ls=s;Snd.tick()}},100)}
async function qLoop(){
  const j=await api("players",{pin:H.pin,hk:H.hk});
  if(j.ps){const a=j.ps.filter(p=>p.a[H.m.i]!=null).length;const e=$("#ac");if(e)e.textContent=`उत्तर: ${a}/${j.ps.length}`;
    if((j.ps.length&&a>=j.ps.length)||srv()>H.t0+H.L*1000+2000){clearInterval(tick);return reveal()}}
  tmr=setTimeout(qLoop,1200)}
async function reveal(){
  clearTimeout(tmr);clearInterval(tick);Snd.stop();
  const j=await api("reveal",{pin:H.pin,hk:H.hk},true);
  if(!j.meta)return;
  const m=j.meta,b=m.b||[];H.m=m;Snd.reveal();
  const mx=Math.max(1,b[0]?b[0].s:1),last=m.i+1>=m.n;
  app.innerHTML=`<div class="card"><div class="big">${esc(m.q)}</div></div>
  <div class="o">${m.o.map((t,i)=>`<div class="c${i} ${i===m.k?"good":"dim"}">${"▲◆●■"[i]} ${esc(t)}</div>`).join("")}</div>
  <div class="card"><b>🏅 स्कोर बोर्ड</b>${b.slice(0,6).map((x,i)=>`<div style="margin:8px 0"><div class="row" style="border:0"><span>${i+1}. ${esc(x.n)}</span><span>${x.s} ${x.d?`<small class="mut">(+${x.d})</small>`:""}</span></div><div class="bb" style="width:${Math.round(x.s/mx*100)}%"></div></div>`).join("")}</div>
  <button class="p" id="nx">${last?"🏆 अंतिम परिणाम":"अगला प्रश्न →"}</button>`;
  $("#nx").onclick=nextQ}
function end(m){
  const b=m.b||[];Snd.stop();Snd.win();
  app.innerHTML=`<div class="card ctr"><div style="font-size:3.5rem">🏆</div><h2>विजेता: ${esc(b[0]?b[0].n:"-")}</h2></div>
  <div class="card">${b.slice(0,10).map((x,i)=>`<div class="row"><span>${["🥇","🥈","🥉"][i]||(i+1)+"."} ${esc(x.n)}</span><span>${x.s}</span></div>`).join("")}</div>
  <button class="p" id="nw">नया गेम (वर्तमान गेम बंद करें)</button>`;
  $("#nw").onclick=async()=>{$("#nw").disabled=true;await api("close",{pin:H.pin,hk:H.hk},true);location.reload()}}
</script></body></html>
